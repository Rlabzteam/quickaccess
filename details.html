<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RLabZ Projects Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top,#1e3a8a,#020617);
    color:white;
    min-height:100vh;
}

/* HEADER */

header{
    text-align:center;
    padding:50px 20px;
}

header h1{
    font-size:3rem;
    background:linear-gradient(to right,#38bdf8,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}

header p{
    margin-top:10px;
    color:#cbd5e1;
}

/* CONTAINER */

.container{
    padding:40px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    transition:0.4s;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.card h3{
    margin-bottom:12px;
    color:white;
}

.card p{
    color:#cbd5e1;
    margin:6px 0;
    font-size:14px;
}

/* STATUS */

.status{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    display:inline-block;
    margin-top:10px;
    font-weight:bold;
}

.deployed{
    background:#22c55e;
}

.dev{
    background:#f59e0b;
}

/* BUTTON */

.btn{
    margin-top:15px;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:linear-gradient(45deg,#38bdf8,#22c55e);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    opacity:0.9;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    padding-top:80px;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
}

.modal-content{
    background:#020617;
    margin:auto;
    padding:25px;
    border-radius:15px;
    width:60%;
    animation:fadeIn 0.4s;
    border:1px solid rgba(255,255,255,0.1);
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content p{
    margin:10px 0;
    color:#cbd5e1;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
}

a{
    color:#38bdf8;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(0.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* MOBILE */

@media(max-width:768px){

    .modal-content{
        width:90%;
    }

    header h1{
        font-size:2rem;
    }

}

</style>
</head>

<body>

<header>
    <h1>RLabZ Projects</h1>

    <p>Dynamic Projects Dashboard</p>

    <a href="admin.html">

        <button class="btn manage-btn">

            Manage Projects

        </button>

    </a>

</header>

<div class="container">

    <div class="grid" id="projectGrid">

        <!-- Dynamic Cards -->

    </div>

</div>

<!-- MODAL -->

<div id="projectModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <div id="modalBody"></div>

    </div>

</div>

<script>

const apiURL = "https://sheetdb.io/api/v1/bgnhxcleqnsyj";

let projectsData = [];

fetch(apiURL)

.then(response => response.json())

.then(data => {

    // Remove empty rows
    projectsData = data.filter(project =>
        project.project_name &&
        project.project_name.trim() !== ""
    );

    let html = "";

    projectsData.forEach((project,index) => {

        let statusClass =
        project.status === "Deployed"
        ? "deployed"
        : "dev";

        html += `

        <div class="card">

            <h3>${project.project_name}</h3>

            <p><b>Type:</b> ${project.type}</p>

            <p><b>Team:</b> ${project.team}</p>

            <span class="status ${statusClass}">
                ${project.status}
            </span>

            <br>

            <button class="btn"
            onclick="openModal(${index})">

                View Details

            </button>

        </div>

        `;

    });

    document.getElementById("projectGrid").innerHTML = html;

})

.catch(error => {

    document.getElementById("projectGrid").innerHTML = `
    
    <h2>Failed to load projects</h2>
    
    `;

    console.log(error);

});

function openModal(index){

    const p = projectsData[index];

    let websiteHTML = "";

    if(p.website && p.website.trim() !== ""){

        websiteHTML = `
        <p>
            <b>Website:</b>
            <a href="${p.website}" target="_blank">
                Visit Project
            </a>
        </p>
        `;

    }

    document.getElementById("modalBody").innerHTML = `

        <h2>${p.project_name}</h2>

        <p><b>Status:</b> ${p.status}</p>

        <p><b>Type:</b> ${p.type}</p>

        <p><b>Team:</b> ${p.team}</p>

        <p><b>Faculty:</b> ${p.faculty}</p>

        <p><b>Launched:</b> ${p.launched}</p>

        ${websiteHTML}

        <p><b>Description:</b></p>

        <p>${p.description}</p>

        <hr style="margin:20px 0;border-color:rgba(255,255,255,0.1);">

        <p><b>Last Updated By:</b>
        ${p.updated_by || "Not Available"}
        </p>

        <p><b>Updated At:</b>
        ${p.updated_at || "Not Available"}
        </p>

    `;

    document.getElementById("projectModal").style.display = "block";

}

function closeModal(){

    document.getElementById("projectModal").style.display = "none";

}

window.onclick = function(event){

    let modal =
    document.getElementById("projectModal");

    if(event.target == modal){

        closeModal();

    }

}

</script>

</body>

    margin-top:50px;

">

    <p style="margin-bottom:8px;">
        Designed for <b style="color:#38bdf8;">Rajagiri CS Department</b> • Quick Access Portal
    </p>

    <p>

</footer>
</html>
