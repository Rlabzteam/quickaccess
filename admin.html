<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RLabZ Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top,#1e3a8a,#020617);
    color:white;
    min-height:100vh;
    padding:30px;
}

/* LOGIN */

#loginBox{
    max-width:400px;
    margin:100px auto;
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
}

#loginBox h2{
    margin-bottom:20px;
    text-align:center;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
}

textarea{
    min-height:100px;
}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#38bdf8,#22c55e);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* ADMIN PANEL */

#adminPanel{
    display:none;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
    background:linear-gradient(to right,#38bdf8,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}

.logout-btn{
    width:auto;
    padding:10px 20px;
    margin-top:15px;
    background:#ef4444;
}

.form-box{
    background:rgba(255,255,255,0.05);
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
    border:1px solid rgba(255,255,255,0.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.1);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#cbd5e1;
    margin:6px 0;
}

.action-btn{
    width:auto;
    padding:10px 15px;
    margin-right:10px;
}

.delete-btn{
    background:#ef4444;
}

.edit-btn{
    background:#f59e0b;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:10px;
}

.deployed{
    background:#22c55e;
}

.dev{
    background:#f59e0b;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

    <h2>RLabZ Admin Login</h2>

    <input type="password"
    id="password"
    placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

</div>

<!-- ADMIN PANEL -->

<div id="adminPanel">

<header>

    <h1>RLabZ Admin Panel</h1>

    <button class="logout-btn"
    onclick="logout()">

        Logout

    </button>

</header>

<!-- FORM -->

<div class="form-box">

    <h2 id="formTitle">
        Add New Project
    </h2>

    <input type="hidden" id="editNo">

    <input type="text"
    id="project_name"
    placeholder="Project Name">

    <input type="text"
    id="status"
    placeholder="Status">

    <input type="text"
    id="type"
    placeholder="Type">

    <input type="text"
    id="team"
    placeholder="Team">

    <input type="text"
    id="faculty"
    placeholder="Faculty">

    <input type="text"
    id="launched"
    placeholder="Launched">

    <input type="text"
    id="website"
    placeholder="Website">

    <textarea id="description"
    placeholder="Description"></textarea>

    <button onclick="saveProject()">
        Save Project
    </button>

</div>

<!-- PROJECTS -->

<div class="grid" id="projectsGrid"></div>

</div>

<script>

const API =
"https://sheetdb.io/api/v1/bgnhxcleqnsyj";

const ADMIN_PASSWORD = "rlabz123";

const DELETE_PASSWORD = "rlabzandcs";

let projects = [];

/* LOGIN */

function login(){

    let pass =
    document.getElementById("password").value;

    if(pass === ADMIN_PASSWORD){

        document.getElementById("loginBox")
        .style.display = "none";

        document.getElementById("adminPanel")
        .style.display = "block";

        loadProjects();

    }
    else{

        alert("Wrong Password");

    }

}

/* LOGOUT */

function logout(){

    document.getElementById("adminPanel")
    .style.display = "none";

    document.getElementById("loginBox")
    .style.display = "block";

    document.getElementById("password")
    .value = "";

}

/* LOAD PROJECTS */

function loadProjects(){

    fetch(API)

    .then(res => res.json())

    .then(data => {

        projects = data.filter(p =>

            p.project_name &&
            p.project_name.trim() !== "" &&
            p.project_name !== "project_name"

        );

        renderProjects();

    });

}

/* RENDER */

function renderProjects(){

    let html = "";

    projects.forEach(project => {

        let statusClass =
        project.status === "Deployed"
        ? "deployed"
        : "dev";

        html += `

        <div class="card">

            <h3>${project.project_name}</h3>

            <p>
            <b>Type:</b>
            ${project.type}
            </p>

            <p>
            <b>Team:</b>
            ${project.team}
            </p>

            <p>
            <b>Faculty:</b>
            ${project.faculty}
            </p>

            <span class="status ${statusClass}">
                ${project.status}
            </span>

            <br><br>

            <button class="action-btn edit-btn"
            onclick="editProject('${project.no}')">

                Edit

            </button>

            <button class="action-btn delete-btn"
            onclick="deleteProject('${project.no}')">

                Delete

            </button>

        </div>

        `;

    });

    document.getElementById("projectsGrid")
    .innerHTML = html;

}

/* EDIT */

function editProject(no){

    let p =
    projects.find(x => x.no == no);

    document.getElementById("editNo")
    .value = p.no;

    document.getElementById("project_name")
    .value = p.project_name;

    document.getElementById("status")
    .value = p.status;

    document.getElementById("type")
    .value = p.type;

    document.getElementById("team")
    .value = p.team;

    document.getElementById("faculty")
    .value = p.faculty;

    document.getElementById("launched")
    .value = p.launched;

    document.getElementById("website")
    .value = p.website;

    document.getElementById("description")
    .value = p.description;

    document.getElementById("formTitle")
    .innerText = "Edit Project";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* SAVE */

function saveProject(){

    let editNo =
    document.getElementById("editNo").value;

    let data = {

        no: editNo || String(Date.now()),

        project_name:
        document.getElementById("project_name").value,

        status:
        document.getElementById("status").value,

        type:
        document.getElementById("type").value,

        team:
        document.getElementById("team").value,

        faculty:
        document.getElementById("faculty").value,

        launched:
        document.getElementById("launched").value,

        website:
        document.getElementById("website").value,

        description:
        document.getElementById("description").value

    };

    /* UPDATE */

    if(editNo){

        fetch(API + "/no/" + editNo, {

            method:"PATCH",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                data:data
            })

        })

        .then(() => {

            alert("Project Updated");

            clearForm();

            loadProjects();

        });

    }

    /* ADD */

    else{

        fetch(API, {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                data:[data]
            })

        })

        .then(() => {

            alert("Project Added");

            clearForm();

            loadProjects();

        });

    }

}

/* DELETE */

function deleteProject(no){

    let pass =
    prompt("Enter Delete Password");

    if(pass !== DELETE_PASSWORD){

        alert("Wrong Delete Password");

        return;

    }

    if(!confirm("Delete this project?"))
    return;

    fetch(API + "/no/" + no, {

        method:"DELETE"

    })

    .then(() => {

        alert("Project Deleted");

        loadProjects();

    });

}

/* CLEAR FORM */

function clearForm(){

    document.getElementById("editNo")
    .value = "";

    document.getElementById("project_name")
    .value = "";

    document.getElementById("status")
    .value = "";

    document.getElementById("type")
    .value = "";

    document.getElementById("team")
    .value = "";

    document.getElementById("faculty")
    .value = "";

    document.getElementById("launched")
    .value = "";

    document.getElementById("website")
    .value = "";

    document.getElementById("description")
    .value = "";

    document.getElementById("formTitle")
    .innerText = "Add New Project";

}

</script>

</body>
</html>
