<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rajagiri Portal Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#eef2ff;--muted:#a5b0d6;--edge:rgba(255,255,255,.18);--accent:#5eead4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 800px at 70% -10%,#1b2a7a,transparent 60%),linear-gradient(170deg,#0a1240,#050719);overflow-x:hidden;line-height:1.5;position:relative}
@media (pointer:fine){body,a,button,input{cursor:none}}
#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 20px}

/* planets + rocket */
.planet{position:fixed;border-radius:50%;z-index:1;pointer-events:none;animation:float 9s ease-in-out infinite alternate}
.p1{width:130px;height:130px;top:16%;left:-30px;background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b 55%,#92400e);box-shadow:0 0 60px rgba(245,158,11,.35)}
.p1::after{content:"";position:absolute;left:-40%;top:42%;width:180%;height:22%;border:3px solid rgba(253,230,138,.55);border-radius:50%;transform:rotate(-18deg)}
.p2{width:90px;height:90px;bottom:22%;right:-18px;background:radial-gradient(circle at 35% 30%,#a5f3fc,#6366f1 60%,#1e1b4b);box-shadow:0 0 50px rgba(99,102,241,.45);animation-duration:12s}
@keyframes float{to{transform:translateY(-34px) rotate(8deg)}}
.rocket{position:fixed;z-index:1;font-size:30px;top:8%;left:-60px;pointer-events:none;animation:fly 18s linear infinite 4s;filter:drop-shadow(0 0 12px #f97316)}
@keyframes fly{0%{transform:translate(0,60px) rotate(60deg)}100%{transform:translate(115vw,-30px) rotate(60deg)}}

/* top bar */
.topbar{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid var(--edge);border-top-color:rgba(255,255,255,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#07102e;background:conic-gradient(from 0deg,#5eead4,#818cf8,#f472b6,#fbbf24,#5eead4);animation:spin 6s linear infinite}
.logo b{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#0a1240;color:#fff;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.clockbox{display:flex;align-items:center;gap:12px}
.digital{text-align:right;font-family:'Sora';font-variant-numeric:tabular-nums}
.digital .t{font-size:1.15rem;font-weight:700;text-shadow:0 0 14px rgba(94,234,212,.8)}
.digital .d{font-size:12px;color:var(--muted);font-family:'Inter'}
.colon{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.analog{width:58px;height:58px;filter:drop-shadow(0 0 8px rgba(94,234,212,.5))}
.analog line{stroke-linecap:round}

/* hero */
.hero{text-align:center;padding:60px 0 20px}
h1{font-family:'Sora';font-weight:800;font-size:clamp(2.1rem,6.4vw,4.2rem);line-height:1.1;letter-spacing:-.02em}
h1 span{display:inline-block;background:linear-gradient(120deg,#fff,#5eead4,#818cf8,#f472b6,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wave 2.6s ease-in-out infinite,hue 6s linear infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes hue{to{background-position:300% 0}}
.hero p{color:var(--muted);margin-top:14px;font-size:1.05rem;min-height:1.6em}
.hero p i{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}

.search{max-width:520px;margin:28px auto 0;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.25s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(94,234,212,.2),0 0 40px rgba(94,234,212,.25)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:12px 0}
.search input::placeholder{color:var(--muted)}
.search button{border:0;font:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;color:#07102e;background:linear-gradient(135deg,#5eead4,#99f6e4)}
.search button[hidden]{display:none}

/* portals */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 20px;padding:70px 0 20px}
.card{display:block;text-decoration:none;color:inherit;text-align:center;position:relative;padding:62px 16px 20px;margin-top:10px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid var(--edge);border-top-color:rgba(255,255,255,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(2,4,24,.5);transform:perspective(700px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s,box-shadow .3s,border-color .3s;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.6) rotate(-6deg)}}
.card:hover,.card:focus-visible{border-color:var(--c1);box-shadow:0 20px 50px rgba(2,4,24,.6),0 0 40px -6px var(--c1);outline:0}
.ring{position:absolute;left:50%;top:-44px;width:92px;height:92px;margin-left:-46px;display:grid;place-items:center;font-size:32px;animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
@keyframes bob{50%{transform:translateY(-8px)}}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--c1),var(--c2),transparent 40%,var(--c1));animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%);filter:drop-shadow(0 0 8px var(--c1))}
.ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle,#050719 30%,var(--c2) 140%);box-shadow:inset 0 0 18px var(--c1);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.88);box-shadow:inset 0 0 28px var(--c2)}}
.ring em{position:relative;z-index:1;font-style:normal;transition:transform .4s}
.card:hover .ring::before{animation-duration:.7s}
.card:hover .ring em{transform:scale(1.35) rotate(12deg)}
.card h3{font-family:'Sora';font-size:16px;margin-top:8px}
.card span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.enter{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;color:#07102e;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:0;transform:translateY(8px);transition:.3s}
.card:hover .enter,.card:focus-visible .enter{opacity:1;transform:none}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
.empty.show{display:block}

footer{position:relative;z-index:2;max-width:1100px;margin:50px auto 110px;padding:20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
footer b{color:#7dd3fc}footer a{font-weight:700;text-decoration:none;border-bottom:1px dashed currentColor;transition:.2s}footer a:hover{text-shadow:0 0 14px currentColor}.f2{color:#5eead4}.f3{color:#fbbf24}

/* warp + cursor */
.warp{position:fixed;z-index:9998;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--c1),var(--c2),#fff,var(--c1));animation:warp .9s ease-in forwards}
@keyframes warp{0%{transform:scale(0) rotate(0);opacity:1}70%{opacity:1}100%{transform:scale(160) rotate(540deg);opacity:0}}
.dot,.cring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;display:none}
.dot{width:8px;height:8px;margin:-4px;background:#fff;box-shadow:0 0 14px #5eead4,0 0 30px #5eead4}
.cring{width:38px;height:38px;margin:-19px;border:2px solid rgba(94,234,212,.7);transition:width .25s,height .25s,margin .25s,background .25s,border-color .25s}
.cring.big{width:68px;height:68px;margin:-34px;background:rgba(94,234,212,.12);border-color:#f472b6}
.cring.down{width:26px;height:26px;margin:-13px}
@media (pointer:fine){.dot,.cring{display:block}}
.spark{position:fixed;z-index:9997;pointer-events:none;width:7px;height:7px;border-radius:50%;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* mini robots on cards */
.card:hover,.card:focus-within{z-index:10}
.mini{position:absolute;right:12px;bottom:10px;width:34px;height:38px;animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s)}
.mini svg{width:100%;height:100%;overflow:visible}
.mbub{position:absolute;right:-6px;bottom:100%;margin-bottom:8px;width:max-content;max-width:170px;padding:7px 10px;border-radius:12px;font-size:12px;font-weight:600;line-height:1.35;text-align:left;color:#07102e;background:#fff;transform:scale(0);transform-origin:bottom right;transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:6}
.mbub::after{content:"";position:absolute;top:100%;right:16px;border:6px solid transparent;border-top-color:#fff}
.mbub.on{transform:scale(1)}
/* buttons + game */
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{border:1px solid var(--edge);background:rgba(255,255,255,.1);color:var(--text);font:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.2s}
.pill:hover{background:rgba(94,234,212,.2);border-color:var(--accent)}
.pill.play{color:#07102e;border:0;background:linear-gradient(135deg,#f472b6,#fbbf24);box-shadow:0 0 30px rgba(244,114,182,.45);animation:pulseBtn 2s ease-in-out infinite}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
.gm{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;background:rgba(3,5,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gm[hidden]{display:none}
.gbox{width:min(92vw,400px);padding:14px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-top-color:rgba(255,255,255,.4);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-family:'Sora';font-size:14px}
.ghead button{border:0;border-radius:50%;width:32px;height:32px;background:rgba(255,255,255,.15);color:#fff;font-size:14px}
#gcv{display:block;width:100%;height:auto;border-radius:16px;background:linear-gradient(#0a1240,#050719);touch-action:none}
.ghint{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
.air .a1{transform:rotate(-150deg)}.air .a2{transform:rotate(150deg)}.air .l1{transform:rotate(-25deg)}.air .l2{transform:rotate(25deg)}
/* robot */
.robot{position:fixed;left:0;top:0;z-index:9000;width:68px;height:94px;will-change:transform}
.hop{width:100%;height:100%}
.flip{width:100%;height:100%;transform:scaleX(var(--dir,1))}
.robot svg{width:100%;height:100%;overflow:visible}
.robot .body{animation:idle 2.6s ease-in-out infinite}
.walking .body{animation:bounce .5s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px)}}
@keyframes bounce{50%{transform:translateY(-4px) rotate(2deg)}}
.leg,.arm{transform-origin:var(--o)}
.walking .l1,.walking .a2{animation:swing .5s ease-in-out infinite alternate}
.walking .l2,.walking .a1{animation:swing .5s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.waving .a2{animation:waveArm .35s ease-in-out infinite alternate}
@keyframes waveArm{from{transform:rotate(150deg)}to{transform:rotate(110deg)}}
.eye{animation:eyeblink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes eyeblink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.led{animation:blink .8s steps(2) infinite}
.jump .hop{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{40%{transform:translateY(-70px)}}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(0);transform-origin:bottom;white-space:nowrap;padding:7px 12px;margin-bottom:6px;border-radius:14px;font-size:12px;font-weight:600;color:#07102e;background:#fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.bubble.on{transform:translateX(-50%) scale(1)}
.shadow{position:absolute;left:10px;right:10px;bottom:-4px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px)}

@media (max-width:560px){.hero{padding-top:44px}.analog{display:none}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 'College Site':['Home sweet campus! The official Rajagiri website.','Start here for the college homepage.','Want the college site? Hit Enter!'],

 'Department Documents':['Forms, circulars and files are in here.','Need a form? Look inside.','Paperwork is my favorite. Said no bot ever.']
};
const miniBot=()=>`<div class="mini" title="Hi!"><div class="mbub"></div><svg viewBox="0 0 40 44"><line x1="20" y1="7" x2="20" y2="2" stroke="#94a3b8" stroke-width="2"/><circle class="led" cx="20" cy="2" r="2.5" style="fill:var(--c1)"/><rect x="6" y="7" width="28" height="20" rx="7" fill="#e2e8f0"/><rect x="10" y="12" width="20" height="10" rx="5" fill="#0b1230"/><ellipse class="eye" cx="16" cy="17" rx="2.4" ry="3" style="fill:var(--c1)"/><ellipse class="eye" cx="24" cy="17" rx="2.4" ry="3" style="fill:var(--c1)"/><rect x="11" y="29" width="18" height="12" rx="5" fill="#cbd5e1"/></svg></div>`;
portals.forEach((p,i)=>{
  const a = document.createElement('a');
  a.className='card'; a.href=p[2]; a.target='_blank'; a.rel='noopener';
  a.style.cssText=`--i:${i};--c1:${p[4]};--c2:${p[5]}`;
  a.dataset.name = p[0];
  a.innerHTML=`<div class="ring"><em>${p[3]}</em></div><h3>${p[0]}</h3><span>${p[1]}</span><div class="enter">Enter portal</div>${miniBot()}`;
  grid.appendChild(a);
});

/* ---------- Animated title + typewriter ---------- */
const title = $('title');
const words = title.textContent.split(' ');
title.textContent = '';
let li = 0;
words.forEach((w,wi)=>{
  [...w].forEach(c=>{
    const s=document.createElement('span'); s.textContent=c; s.setAttribute('aria-hidden','true');
    s.style.animationDelay=`${li*0.09}s, ${li*-0.2}s`; li++; title.appendChild(s);
  });
  if(wi<words.length-1) title.appendChild(document.createTextNode(' '));
});
const lines=['Step through a portal to any Rajagiri system.','Pick a portal. Hit the warp.','One page. Eleven doorways.'];
const typeEl=$('type'); let ln=0,ch=0,del=false;
(function type(){
  const t=lines[ln];
  typeEl.textContent=t.slice(0,ch);
  if(!del&&ch<t.length){ch++;setTimeout(type,45)}
  else if(!del){del=true;setTimeout(type,1800)}
  else if(ch>0){ch--;setTimeout(type,22)}
  else{del=false;ln=(ln+1)%lines.length;setTimeout(type,300)}
})();

/* ---------- Clock ---------- */
const ticks=$('ticks');
for(let i=0;i<12;i++){const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',50);l.setAttribute('x2',50);l.setAttribute('y1',i%3?8:6);l.setAttribute('y2',i%3?12:14);
  l.setAttribute('transform',`rotate(${i*30} 50 50)`);ticks.appendChild(l)}
const p2=n=>String(n).padStart(2,'0');
function clock(){
  const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
  $('hh').setAttribute('transform',`rotate(${h*30} 50 50)`);
  $('mh').setAttribute('transform',`rotate(${m*6} 50 50)`);
  $('sh').setAttribute('transform',`rotate(${s*6} 50 50)`);
  const t=`${p2(d.getHours())}<span class="colon">:</span>${p2(d.getMinutes())}<span class="colon">:</span>${p2(d.getSeconds())}`;
  if($('time').dataset.s!==t){$('time').dataset.s=t;$('time').innerHTML=t}
  $('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  requestAnimationFrame(clock);
}
clock();

/* ---------- Starfield ---------- */
const cv=$('stars'),cx=cv.getContext('2d');
let W,H,stars=[],shoots=[],mx=0,my=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  stars=Array.from({length:Math.min(170,W/6)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6,z:Math.random()*.8+.2}))}
size(); addEventListener('resize',size);
function sky(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));cx.fillStyle='#fff';
    cx.beginPath();cx.arc(s.x+mx*s.z*20,s.y+my*s.z*20,s.r,0,6.3);cx.fill();
  });
  if(!reduce&&Math.random()<.008)shoots.push({x:Math.random()*W*.7,y:Math.random()*H*.5,l:0,v:9+Math.random()*6});
  shoots=shoots.filter(s=>s.l<60);
  shoots.forEach(s=>{
    s.l++;s.x+=s.v;s.y+=s.v*.45;
    const g=cx.createLinearGradient(s.x,s.y,s.x-90,s.y-40);g.addColorStop(0,'rgba(94,234,212,.95)');g.addColorStop(1,'transparent');
    cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-90,s.y-40);cx.stroke();
  });
  if(!reduce)requestAnimationFrame(sky);
}
requestAnimationFrame(sky);

/* ---------- Cursor, sparkles, tilt ---------- */
const dot=$('dot'),ring=$('cring'),fine=matchMedia('(pointer:fine)').matches;
let cxp=innerWidth/2,cyp=innerHeight/2,rx=cxp,ry=cyp,lastSpark=0;
const colors=['#5eead4','#818cf8','#f472b6','#fbbf24'];
addEventListener('mousemove',e=>{
  cxp=e.clientX;cyp=e.clientY;
  dot.style.transform=`translate(${cxp}px,${cyp}px)`;
  mx=cxp/innerWidth-.5;my=cyp/innerHeight-.5;
  const n=performance.now();
  if(!reduce&&fine&&n-lastSpark>45){
    lastSpark=n;const s=document.createElement('i');s.className='spark';
    s.style.cssText=`left:${cxp}px;top:${cyp}px;background:${colors[Math.random()*4|0]};--dx:${(Math.random()-.5)*50}px;--dy:${Math.random()*40+10}px`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
});
(function follow(){rx+=(cxp-rx)*.18;ry+=(cyp-ry)*.18;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(follow)})();
addEventListener('mousedown',()=>ring.classList.add('down'));
addEventListener('mouseup',()=>ring.classList.remove('down'));
document.addEventListener('mouseover',e=>ring.classList.toggle('big',!!e.target.closest('a,button,input,.robot')));

grid.addEventListener('mousemove',e=>{
  const c=e.target.closest('.card');if(!c||reduce)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.setProperty('--ry',x*14+'deg');c.style.setProperty('--rx',-y*14+'deg');
});
grid.addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});

/* Portal warp on click (the link still opens in a new tab) */
grid.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const w=document.createElement('div');w.className='warp';
  w.style.cssText=`left:${e.clientX||innerWidth/2}px;top:${e.clientY||innerHeight/2}px;--c1:${c.style.getPropertyValue('--c1')};--c2:${c.style.getPropertyValue('--c2')}`;
  document.body.appendChild(w);setTimeout(()=>w.remove(),950);
  say(`Warping to ${c.dataset.name}!`,2200);hop();
});

/* ---------- Search ---------- */
const input=$('search'),clear=$('clear'),empty=$('empty');
function filter(){
  const q=input.value.trim().toLowerCase();let n=0;
  grid.querySelectorAll('.card').forEach(c=>{const m=(c.dataset.name+' '+c.querySelector('span').textContent).toLowerCase().includes(q);c.style.display=m?'':'none';if(m)n++});
  empty.classList.toggle('show',!n);clear.hidden=!q;
}
input.addEventListener('input',filter);
clear.addEventListener('click',()=>{input.value='';filter();input.focus()});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus()}});

/* ---------- Robot that hops across the cards ---------- */
const robot=$('robot'),flip=$('flip'),bubble=$('bubble'),FOOT=88,HALF=34;
let rxp=innerWidth*.15,fy=innerHeight-6,vy=0,tx=rxp,dir=1,mode='idle',until=0,bt,plat=null,jump=null,voice=false,bw=140;
const ground=()=>innerHeight-6,pick=a=>a[Math.random()*a.length|0];
const cards=()=>[...grid.querySelectorAll('.card')].filter(c=>c.style.display!=='none');
const floorTalk=['Beep boop! 🤖','Which portal today?','Back on the ground!','Psst, click me.','Try the game up top!','Warp speed ready.'];
function say(t,ms=2800){
  bubble.textContent=t;bubble.classList.add('on');bw=bubble.offsetWidth;
  clearTimeout(bt);bt=setTimeout(()=>bubble.classList.remove('on'),ms);
  if(voice&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\w\s.,!?']/g,''));u.pitch=1.6;u.rate=1.05;speechSynthesis.speak(u)}
}
function hop(){robot.classList.remove('jump');void robot.offsetWidth;robot.classList.add('jump');setTimeout(()=>robot.classList.remove('jump'),750)}
function setMode(m){mode=m;robot.classList.toggle('walking',m==='walk');robot.classList.toggle('waving',m==='wave');robot.classList.toggle('air',m==='air'||m==='fall')}
function cardSay(c,t,ms=3200){const m=c.querySelector('.mbub');m.textContent=t;m.classList.add('on');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),ms)}
function nextTip(c){c._i=((c._i||0)+1)%2;return tips[c.dataset.name][1+c._i]}
function land(c){
  if(!c){say(pick(floorTalk));return}
  const t=tips[c.dataset.name];say(t[0],3400);
  setTimeout(()=>cardSay(c,t[1+(Math.random()*2|0)]),1600);
}
function startJump(c){
  const b=c&&c.getBoundingClientRect();
  const x1=c?b.left+(Math.random()<.5?24+Math.random()*30:b.width-24-Math.random()*30):40+Math.random()*Math.max(100,innerWidth-120);
  const y1=c?b.top+2:ground();
  jump={c,x0:rxp,y0:fy,x1,off:c?x1-b.left:0,t:0,peak:60+Math.max(0,fy-y1)};
  dir=x1>=rxp?1:-1;flip.style.setProperty('--dir',dir);plat=null;setMode('air');
}
function decide(now){
  const r=Math.random();
  const vis=cards().filter(c=>{const b=c.getBoundingClientRect();return c!==plat&&b.top>150&&b.top<innerHeight-70});
  if(r<.5&&vis.length){startJump(pick(vis));return}
  if(plat&&r<.58){startJump(null);return}
  if(r<.8){
    const b=plat&&plat.getBoundingClientRect(),lo=b?b.left+20:30,hi=b?b.right-20:innerWidth-60;
    tx=lo+Math.random()*Math.max(1,hi-lo);dir=tx>rxp?1:-1;flip.style.setProperty('--dir',dir);setMode('walk');return;
  }
  if(r<.9){setMode('wave');until=now+2200;say(plat?tips[plat.dataset.name][0]:pick(floorTalk));return}
  setMode('idle');until=now+1500+Math.random()*1500;
}
let prev=performance.now();
function step(now){
  const dt=Math.min(now-prev,60)/1000;prev=now;
  if(mode==='air'){
    const j=jump,b=j.c&&j.c.getBoundingClientRect();
    const x1=j.c?b.left+j.off:j.x1,y1=j.c?b.top+2:ground();
    j.t=Math.min(1,j.t+dt/.95);
    rxp=j.x0+(x1-j.x0)*j.t;fy=j.y0+(y1-j.y0)*j.t-Math.sin(Math.PI*j.t)*j.peak;
    if(j.t>=1){plat=j.c;setMode('idle');until=now+1800;land(j.c)}
  }else if(mode==='fall'){
    vy+=1800*dt;fy+=vy*dt;
    if(fy>=ground()){fy=ground();vy=0;setMode('idle');until=now+600}
  }else{
    if(plat){
      const b=plat.getBoundingClientRect();
      if(plat.style.display==='none'||b.top<130||b.top>innerHeight-30){plat=null;vy=0;setMode('fall')}else fy=b.top+2;
    }else fy=ground();
    if(mode==='walk'){
      rxp+=dir*75*dt;
      if((dir>0&&rxp>=tx)||(dir<0&&rxp<=tx)){setMode('idle');until=now+1200+Math.random()*2000}
    }else if(mode!=='fall'&&now>until)decide(now);
  }
  if(bubble.classList.contains('on')){bubble.style.marginLeft=(Math.max(0,bw/2+8-rxp)-Math.max(0,rxp+bw/2+8-innerWidth))+'px'}
  robot.style.transform=`translate(${rxp-HALF}px,${fy-FOOT}px)`;
  requestAnimationFrame(step);
}
robot.style.transform=`translate(${rxp-HALF}px,${fy-FOOT}px)`;
if(!reduce)requestAnimationFrame(step);
addEventListener('resize',()=>{rxp=Math.min(rxp,innerWidth-40)});
robot.addEventListener('click',()=>{say(pick(['Ouch! Hello 👋','Wheee!','Beep!','Stop poking me 😄']));hop()});
setTimeout(()=>say('Hi! Watch me hop on the cards. 🤖',3200),1200);

/* ---------- Mini robots on cards ---------- */
let lastHover=null;
grid.addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(c&&c!==lastHover)cardSay(c,nextTip(c),2800);lastHover=c});
grid.addEventListener('click',e=>{
  const m=e.target.closest('.mini');if(!m)return;
  e.preventDefault();e.stopImmediatePropagation();
  const c=m.closest('.card');cardSay(c,nextTip(c),3000);
},true);
setInterval(()=>{
  const vis=cards().filter(c=>{const b=c.getBoundingClientRect();return b.top>0&&b.bottom<innerHeight});
  if(vis.length){const c=pick(vis);cardSay(c,nextTip(c),3200)}
},7000);

/* ---------- Voice toggle ---------- */
const vb=$('voice');
if(!('speechSynthesis' in window))vb.hidden=true;
vb.addEventListener('click',()=>{
  voice=!voice;vb.textContent=voice?'🔊 Robot voice: on':'🔈 Robot voice: off';
  if(voice)say('Hello! I can talk now.');else speechSynthesis.cancel();
});

/* ---------- Game: Portal Catch ---------- */
const gm=$('gm'),gcv=$('gcv'),g=gcv.getContext('2d'),GW=360,GH=480,gcol=['#5eead4','#818cf8','#f472b6','#fbbf24','#a3e635'];
let G=null,graf=0;
const hiGet=()=>{try{return +localStorage.getItem('rphi')||0}catch(e){return 0}};
const hiSet=v=>{try{localStorage.setItem('rphi',v)}catch(e){}};
const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)};
function gStart(){cancelAnimationFrame(graf);G={x:GW/2,tx:GW/2,score:0,lives:3,items:[],f:0,over:false,flash:0,hi:hiGet()};gLoop()}
function gLoop(){
  const s=G;s.f++;s.x+=(s.tx-s.x)*.25;s.flash=Math.max(0,s.flash-1);
  const speed=2.2+s.score/10;
  if(!s.over&&s.f%Math.max(16,44-s.score)===0)s.items.push({x:22+Math.random()*(GW-44),y:-20,bad:Math.random()<.28,c:gcol[Math.random()*5|0]});
  g.clearRect(0,0,GW,GH);
  g.fillStyle='#fff';g.globalAlpha=.5;
  for(let i=0;i<30;i++)g.fillRect((i*97)%GW,(i*53+s.f*(.4+i%3*.2))%GH,1.5,1.5);
  g.globalAlpha=1;
  for(const it of s.items){
    it.y+=speed;
    if(!s.over&&!it.hit&&it.y>GH-64&&it.y<GH-22&&Math.abs(it.x-s.x)<34){
      it.hit=1;
      if(it.bad){s.lives--;s.flash=12;if(s.lives<=0)s.over=true}else s.score++;
    }
    if(it.hit)continue;
    if(it.bad){g.font='26px serif';g.textAlign='center';g.fillText('🐞',it.x,it.y+9)}
    else{
      g.lineWidth=4;g.strokeStyle=it.c;g.shadowColor=it.c;g.shadowBlur=14;
      g.beginPath();g.arc(it.x,it.y,11,0,6.3);g.stroke();g.shadowBlur=0;
      g.fillStyle=it.c;g.globalAlpha=.35;g.beginPath();g.arc(it.x,it.y,6,0,6.3);g.fill();g.globalAlpha=1;
    }
  }
  s.items=s.items.filter(i=>!i.hit&&i.y<GH+20);
  const px=s.x,py=GH-52;
  g.fillStyle=s.flash%4>1?'#f87171':'#e2e8f0';rr(px-27,py,54,32,11);g.fill();
  g.fillStyle='#0b1230';rr(px-21,py+6,42,16,7);g.fill();
  g.fillStyle='#5eead4';g.fillRect(px-12,py+10,7,8);g.fillRect(px+5,py+10,7,8);
  g.fillStyle='#94a3b8';g.fillRect(px-2,py-8,4,8);g.fillStyle='#f472b6';g.beginPath();g.arc(px,py-9,4,0,6.3);g.fill();
  $('gscore').textContent='Score '+s.score+'  Best '+Math.max(s.hi,s.score);
  $('glives').textContent='❤'.repeat(Math.max(0,s.lives));
  if(s.over){
    if(s.score>s.hi){hiSet(s.score);s.hi=s.score}
    g.fillStyle='rgba(5,7,25,.75)';g.fillRect(0,0,GW,GH);
    g.fillStyle='#fff';g.textAlign='center';g.font='700 28px Sora, sans-serif';g.fillText('Game over',GW/2,GH/2-10);
    g.font='15px Inter, sans-serif';g.fillText('Score '+s.score+'. Tap or press Enter to play again',GW/2,GH/2+20);
    say('Good game! You scored '+s.score+'.');
    return;
  }
  graf=requestAnimationFrame(gLoop);
}
function gx(cx){const r=gcv.getBoundingClientRect();G.tx=Math.max(28,Math.min(GW-28,(cx-r.left)/r.width*GW))}
gcv.addEventListener('mousemove',e=>G&&gx(e.clientX));
gcv.addEventListener('touchmove',e=>{e.preventDefault();G&&gx(e.touches[0].clientX)},{passive:false});
gcv.addEventListener('touchstart',e=>{G&&gx(e.touches[0].clientX)},{passive:true});
gcv.addEventListener('click',()=>{if(G&&G.over)gStart()});
function gClose(){gm.hidden=true;cancelAnimationFrame(graf)}
addEventListener('keydown',e=>{
  if(gm.hidden||!G)return;
  if(e.key==='ArrowLeft'){e.preventDefault();G.tx=Math.max(28,G.tx-50)}
  if(e.key==='ArrowRight'){e.preventDefault();G.tx=Math.min(GW-28,G.tx+50)}
  if(e.key==='Enter'&&G.over)gStart();
  if(e.key==='Escape')gClose();
});
$('play').addEventListener('click',()=>{gm.hidden=false;gStart();say('Catch the portals! Dodge the bugs!')});
$('gclose').addEventListener('click',gClose);
</script>
